server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Must always be fresh: entry HTML, runtime config (ConfigMap), service worker
    location ~ ^/(index\.html|config\.json|sw\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths go to Vue Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
